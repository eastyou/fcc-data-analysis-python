<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  :root { --bg:#0f172a; --card:#1b2540; --line:#32406b; --text:#eef2ff; --muted:#9aa7c7; --x:#38bdf8; --o:#f472b6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:radial-gradient(circle at 50% 0%, #1e2b52, var(--bg) 65%); color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; }
  h1 { margin:0; font-size:22px; }
  .scoreboard { display:flex; gap:18px; color:var(--muted); font-size:14px; }
  .scoreboard strong { color:var(--text); }
  #board { display:grid; grid-template-columns:repeat(3, 96px); grid-template-rows:repeat(3, 96px); gap:8px; }
  .cell { background:var(--card); border:1px solid var(--line); border-radius:12px; display:grid; place-items:center; font-size:46px; font-weight:700; cursor:pointer; user-select:none; transition:background .15s, transform .1s; }
  .cell:hover { background:#233157; }
  .cell:active { transform:scale(.97); }
  .cell.x { color:var(--x); }
  .cell.o { color:var(--o); }
  .cell.win { background:#1e3a8a; }
  #status { min-height:22px; color:var(--muted); }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; cursor:pointer; border-radius:9px; border:1px solid var(--line); background:#22305a; color:var(--text); padding:8px 14px; }
  button.active { background:#2563eb; border-color:#2563eb; }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="scoreboard">
    <span>You <strong id="scoreHuman">0</strong></span>
    <span>CPU <strong id="scoreCpu">0</strong></span>
    <span>Draws <strong id="scoreDraw">0</strong></span>
  </div>
  <div id="board" aria-label="Tic tac toe board"></div>
  <p id="status">Your turn — you are X.</p>
  <div class="row">
    <button id="symbolX" class="active">Play as X</button>
    <button id="symbolO">Play as O</button>
    <button id="reset">New game</button>
  </div>
<script>
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const state = { board: Array(9).fill(""), human: "X", cpu: "O", turn: "X", over: false, scores: { human: 0, cpu: 0, draw: 0 } };
  const boardEl = document.getElementById("board");

  function render() {
    boardEl.innerHTML = state.board.map((value, index) =>
      `<div class="cell ${value ? value.toLowerCase() : ""}" data-index="${index}">${value}</div>`
    ).join("");
  }

  function winner(board) {
    for (const [a, b, c] of LINES) {
      if (board[a] && board[a] === board[b] && board[a] === board[c]) return { player: board[a], line: [a, b, c] };
    }
    return board.every(Boolean) ? { player: "draw", line: [] } : null;
  }

  function finish(result) {
    state.over = true;
    if (result.player === "draw") {
      state.scores.draw += 1;
      document.getElementById("status").textContent = "It's a draw.";
    } else if (result.player === state.human) {
      state.scores.human += 1;
      document.getElementById("status").textContent = "You win! 🎉";
    } else {
      state.scores.cpu += 1;
      document.getElementById("status").textContent = "CPU wins.";
    }
    result.line.forEach((index) => boardEl.children[index].classList.add("win"));
    document.getElementById("scoreHuman").textContent = state.scores.human;
    document.getElementById("scoreCpu").textContent = state.scores.cpu;
    document.getElementById("scoreDraw").textContent = state.scores.draw;
  }

  function minimax(board, player) {
    const result = winner(board);
    if (result) {
      if (result.player === "draw") return { score: 0 };
      return { score: result.player === state.cpu ? 1 : -1 };
    }
    let best = { score: player === state.cpu ? -Infinity : Infinity, move: -1 };
    for (let i = 0; i < 9; i++) {
      if (board[i]) continue;
      board[i] = player;
      const outcome = minimax(board, player === state.cpu ? state.human : state.cpu);
      board[i] = "";
      if (player === state.cpu) {
        if (outcome.score > best.score) best = { score: outcome.score, move: i };
      } else if (outcome.score < best.score) {
        best = { score: outcome.score, move: i };
      }
    }
    return best;
  }

  function cpuMove() {
    if (state.over) return;
    const move = minimax([...state.board], state.cpu).move;
    if (move >= 0) play(move, state.cpu);
  }

  function play(index, player) {
    if (state.over || state.board[index] || player !== state.turn) return;
    state.board[index] = player;
    state.turn = player === "X" ? "O" : "X";
    render();
    const result = winner(state.board);
    if (result) { finish(result); return; }
    if (state.turn === state.cpu) {
      document.getElementById("status").textContent = "CPU is thinking…";
      setTimeout(cpuMove, 320);
    } else {
      document.getElementById("status").textContent = "Your turn.";
    }
  }

  boardEl.addEventListener("click", (event) => {
    const cell = event.target.closest("[data-index]");
    if (!cell) return;
    play(Number(cell.dataset.index), state.human);
  });

  function newGame(symbol) {
    state.human = symbol || state.human;
    state.cpu = state.human === "X" ? "O" : "X";
    state.board = Array(9).fill("");
    state.turn = "X";
    state.over = false;
    document.getElementById("status").textContent = state.human === "X" ? "Your turn — you are X." : "CPU starts.";
    document.getElementById("symbolX").classList.toggle("active", state.human === "X");
    document.getElementById("symbolO").classList.toggle("active", state.human === "O");
    render();
    if (state.turn === state.cpu) setTimeout(cpuMove, 400);
  }

  document.getElementById("symbolX").addEventListener("click", () => newGame("X"));
  document.getElementById("symbolO").addEventListener("click", () => newGame("O"));
  document.getElementById("reset").addEventListener("click", () => newGame());
  newGame("X");
</script>
</body>
</html>
