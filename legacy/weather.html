<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Weather</title>
<style>
  :root { --bg:#071426; --card:#0f2038; --line:#1e3a5f; --text:#e8f2ff; --muted:#8fb0d4; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:radial-gradient(circle at 50% 0%, #123a63, var(--bg) 60%); color:var(--text); display:flex; flex-direction:column; align-items:center; padding:40px 20px; gap:22px; }
  h1 { margin:0; font-size:24px; letter-spacing:.5px; }
  .card { width:min(460px, 92vw); background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,.35); }
  .temp { font-size:64px; font-weight:700; margin:8px 0; }
  .desc { color:var(--muted); text-transform:capitalize; }
  .icon { font-size:52px; }
  .row { display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  input, button { font:inherit; border-radius:10px; border:1px solid var(--line); background:#0a1a2c; color:var(--text); padding:9px 12px; }
  button { cursor:pointer; background:#0369a1; border-color:#0369a1; }
  button.ghost { background:transparent; }
  .meta { color:var(--muted); font-size:13px; display:flex; gap:16px; justify-content:center; margin-top:12px; }
  #status { color:var(--muted); font-size:13px; min-height:18px; }
</style>
</head>
<body>
  <h1>🌤 Local Weather</h1>
  <div class="card">
    <div class="icon" id="icon">🌡</div>
    <div class="temp"><span id="temp">--</span>°<span id="unit">C</span></div>
    <div class="desc" id="desc">Detecting your location…</div>
    <div class="meta">
      <span id="place">Unknown place</span>
      <span id="wind">Wind --</span>
      <span id="humidity">Humidity --</span>
    </div>
    <div class="row">
      <input id="city" placeholder="Or search a city" aria-label="City name">
      <button id="search">Search</button>
      <button class="ghost" id="toggle">°F</button>
    </div>
    <p id="status"></p>
  </div>

<script>
  let unit = "C";
  let current = null;

  const codes = {
    0: ["Clear sky", "☀️"], 1: ["Mainly clear", "🌤"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
    45: ["Fog", "🌫"], 48: ["Rime fog", "🌫"], 51: ["Light drizzle", "🌦"], 53: ["Drizzle", "🌦"],
    55: ["Heavy drizzle", "🌦"], 61: ["Light rain", "🌧"], 63: ["Rain", "🌧"], 65: ["Heavy rain", "🌧"],
    71: ["Light snow", "🌨"], 73: ["Snow", "🌨"], 75: ["Heavy snow", "❄️"], 80: ["Rain showers", "🌦"],
    81: ["Rain showers", "🌧"], 82: ["Violent showers", "⛈"], 95: ["Thunderstorm", "⛈"], 96: ["Thunderstorm", "⛈"], 99: ["Thunderstorm", "⛈"]
  };

  function render() {
    if (!current) return;
    const value = unit === "C" ? current.tempC : current.tempC * 9 / 5 + 32;
    document.getElementById("temp").textContent = Math.round(value);
    document.getElementById("unit").textContent = unit;
    document.getElementById("place").textContent = current.place;
    document.getElementById("wind").textContent = "Wind " + current.wind + " km/h";
    document.getElementById("humidity").textContent = "Humidity " + current.humidity + "%";
    const [label, icon] = codes[current.code] || ["Unknown", "🌡"];
    document.getElementById("desc").textContent = label;
    document.getElementById("icon").textContent = icon;
    document.getElementById("toggle").textContent = unit === "C" ? "°F" : "°C";
  }

  async function loadWeather(lat, lon, place) {
    const status = document.getElementById("status");
    status.textContent = "Loading weather…";
    try {
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`);
      if (!response.ok) throw new Error("Weather request failed");
      const data = await response.json();
      current = {
        place,
        tempC: data.current.temperature_2m,
        humidity: data.current.relative_humidity_2m,
        wind: data.current.wind_speed_10m,
        code: data.current.weather_code
      };
      status.textContent = "";
      render();
    } catch (error) {
      status.textContent = "Could not load weather. Try again.";
    }
  }

  async function searchCity() {
    const name = document.getElementById("city").value.trim();
    if (!name) return;
    const status = document.getElementById("status");
    status.textContent = "Searching…";
    try {
      const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`);
      const data = await response.json();
      if (!data.results || data.results.length === 0) throw new Error("City not found");
      const result = data.results[0];
      await loadWeather(result.latitude, result.longitude, `${result.name}, ${result.country_code || ""}`);
    } catch (error) {
      status.textContent = "City not found. Check the spelling.";
    }
  }

  document.getElementById("search").addEventListener("click", searchCity);
  document.getElementById("city").addEventListener("keydown", (event) => { if (event.key === "Enter") searchCity(); });
  document.getElementById("toggle").addEventListener("click", () => { unit = unit === "C" ? "F" : "C"; render(); });

  function locate() {
    if (!navigator.geolocation) {
      document.getElementById("status").textContent = "Geolocation is not supported. Search a city instead.";
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (position) => loadWeather(position.coords.latitude, position.coords.longitude, "Your location"),
      () => {
        document.getElementById("status").textContent = "Location permission denied. Search a city instead.";
        loadWeather(39.9042, 116.4074, "Beijing, CN");
      },
      { timeout: 8000 }
    );
  }

  locate();
</script>
</body>
</html>
