<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Form — Study Habits</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 16px 64px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #e8f0f7, #f7f4ef);
      color: #22313f;
    }
    .sheet {
      max-width: 620px;
      margin: 0 auto;
      padding: 30px 30px 26px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(24, 50, 70, 0.12);
    }
    #title { margin: 0 0 8px; font-size: 1.8rem; }
    #description { margin: 0 0 26px; color: #5b6b78; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }
    input[type="text"], input[type="email"], input[type="number"], select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd9e0;
      border-radius: 8px;
      font-size: 0.98rem;
      font-family: inherit;
      background: #fbfcfd;
    }
    textarea { min-height: 96px; resize: vertical; }
    .options label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 400;
      margin-bottom: 8px;
    }
    .options input { width: 16px; height: 16px; }
    #submit {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #2f7a5c;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    #submit:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="sheet">
    <h1 id="title">Study Habits Survey</h1>
    <p id="description">Tell us how you study so we can build better learning tools.</p>

    <form id="survey-form">
      <div class="field">
        <label id="name-label" for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required />
      </div>

      <div class="field">
        <label id="email-label" for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label id="number-label" for="number">Hours studied per week</label>
        <input id="number" name="hours" type="number" min="1" max="80" placeholder="e.g. 12" required />
      </div>

      <div class="field">
        <label for="dropdown">Main study environment</label>
        <select id="dropdown" name="environment">
          <option value="home">At home</option>
          <option value="library">Library</option>
          <option value="cafe">Cafe</option>
          <option value="school">School</option>
        </select>
      </div>

      <div class="field options">
        <p><strong>Preferred time of day</strong></p>
        <label><input type="radio" name="time-of-day" value="morning" checked /> Morning</label>
        <label><input type="radio" name="time-of-day" value="afternoon" /> Afternoon</label>
        <label><input type="radio" name="time-of-day" value="evening" /> Evening</label>
      </div>

      <div class="field options">
        <p><strong>What helps you focus?</strong></p>
        <label><input type="checkbox" name="focus" value="music" /> Music</label>
        <label><input type="checkbox" name="focus" value="breaks" /> Short breaks</label>
        <label><input type="checkbox" name="focus" value="notes" /> Handwritten notes</label>
      </div>

      <div class="field">
        <label for="comments">Anything else you want to share?</label>
        <textarea id="comments" name="comments" placeholder="Your thoughts..."></textarea>
      </div>

      <button id="submit" type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
