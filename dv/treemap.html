<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Movie Sales — Treemap</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #0f141a; color: #e8eaed; }
  #chart { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  #title { text-align: center; font-size: 26px; font-weight: 600; margin: 8px 0 4px; }
  #description { text-align: center; color: #9aa4b2; margin-bottom: 18px; font-size: 14px; }
  .tile { stroke: #0f141a; stroke-width: 1; }
  .tile-text { font-size: 10px; fill: #0f141a; pointer-events: none; }
  #legend text { fill: #c8d0da; font-size: 12px; }
  #tooltip {
    position: absolute; opacity: 0; pointer-events: none;
    background: rgba(20, 24, 30, .95); border: 1px solid #4e9af1; color: #fff;
    padding: 8px 10px; border-radius: 6px; font-size: 13px; line-height: 1.4;
    box-shadow: 0 4px 14px rgba(0,0,0,.45); transition: opacity .12s;
  }
</style>
</head>
<body>
<div id="chart">
  <h1 id="title">Movie Sales</h1>
  <p id="description">Top 100 Highest Grossing Movies Grouped By Genre</p>
</div>
<div id="tooltip"></div>
<script>
  const DATA_URL =
    'https://cdn.freecodecamp.org/testable-projects-fcc/data/tree_map/movie-data.json';

  fetch(DATA_URL)
    .then((res) => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then((data) => render(data))
    .catch((err) => {
      document.getElementById('description').textContent = 'Data load failed: ' + err.message;
    });

  function render(data) {
    const width = 1000;
    const height = 620;

    const svg = d3.select('#chart')
      .append('svg')
      .attr('width', width)
      .attr('height', height + 40);

    const chart = svg.append('g').attr('transform', 'translate(0,0)');

    const root = d3.hierarchy(data)
      .sum((d) => d.value || 0)
      .sort((a, b) => b.value - a.value);

    d3.treemap()
      .size([width, height])
      .paddingInner(1)
      .paddingOuter(2)
      (root);

    const categories = root.children.map((d) => d.data.name);
    const color = d3.scaleOrdinal(categories, d3.schemeTableau10);

    const tooltip = d3.select('#tooltip');

    chart.selectAll('.tile')
      .data(root.leaves())
      .enter()
      .append('rect')
      .attr('class', 'tile')
      .attr('x', (d) => d.x0)
      .attr('y', (d) => d.y0)
      .attr('width', (d) => Math.max(0, d.x1 - d.x0))
      .attr('height', (d) => Math.max(0, d.y1 - d.y0))
      .attr('data-name', (d) => d.data.name)
      .attr('data-category', (d) => d.data.category)
      .attr('data-value', (d) => d.data.value)
      .attr('fill', (d) => color(d.data.category))
      .on('mouseover', function (event, d) {
        tooltip
          .attr('data-value', d.data.value)
          .style('opacity', 1)
          .html(
            `<strong>${d.data.name}</strong><br>` +
            `Category: ${d.data.category}<br>` +
            `Value: ${d.data.value}`
          );
        const box = this.getBoundingClientRect();
        tooltip
          .style('left', `${box.left + window.scrollX + 12}px`)
          .style('top', `${box.top + window.scrollY - 20}px`);
      })
      .on('mouseout', () => tooltip.style('opacity', 0));

    chart.selectAll('.tile-text')
      .data(root.leaves())
      .enter()
      .append('text')
      .attr('class', 'tile-text')
      .attr('x', (d) => d.x0 + 3)
      .attr('y', (d) => d.y0 + 12)
      .text((d) => (d.x1 - d.x0 > 40 && d.y1 - d.y0 > 16 ? d.data.name : ''));

    // 图例
    const legend = svg.append('g')
      .attr('id', 'legend')
      .attr('transform', `translate(20,${height + 10})`);

    categories.forEach((cat, i) => {
      const row = legend.append('g')
        .attr('transform', `translate(${(i % 4) * 220},${Math.floor(i / 4) * 22})`);
      row.append('rect')
        .attr('class', 'legend-item')
        .attr('x', 0)
        .attr('y', 0)
        .attr('width', 14)
        .attr('height', 14)
        .attr('fill', color(cat));
      row.append('text')
        .attr('x', 20)
        .attr('y', 12)
        .text(cat);
    });
  }
</script>
</body>
</html>
