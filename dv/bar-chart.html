<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>United States GDP — Bar Chart</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #1b1f24; color: #e8eaed; }
  #chart { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
  #title { text-align: center; font-size: 26px; font-weight: 600; margin: 8px 0 4px; }
  #subtitle { text-align: center; color: #9aa4b2; margin-bottom: 18px; font-size: 14px; }
  .bar { fill: #4e9af1; }
  .bar:hover { fill: #ffb703; }
  .axis path, .axis line { stroke: #9aa4b2; }
  .axis text { fill: #c8d0da; font-size: 12px; }
  .axis-label { fill: #c8d0da; font-size: 13px; }
  #tooltip {
    position: absolute; opacity: 0; pointer-events: none;
    background: rgba(20, 24, 30, .95); border: 1px solid #4e9af1; color: #fff;
    padding: 8px 10px; border-radius: 6px; font-size: 13px; line-height: 1.35;
    box-shadow: 0 4px 14px rgba(0,0,0,.45); transition: opacity .12s;
  }
</style>
</head>
<body>
<div id="chart">
  <h1 id="title">United States GDP</h1>
  <p id="subtitle">Gross Domestic Product, 1947–2015 (quarterly, billions USD)</p>
</div>
<div id="tooltip"></div>
<script>
  const DATA_URL =
    'https://raw.githubusercontent.com/freeCodeCamp/ProjectReferenceData/master/GDP-data.json';

  fetch(DATA_URL)
    .then((res) => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then((data) => render(data.data))
    .catch((err) => {
      document.getElementById('subtitle').textContent = 'Data load failed: ' + err.message;
    });

  function render(dataset) {
    const margin = { top: 30, right: 30, bottom: 70, left: 80 };
    const width = 900 - margin.left - margin.right;
    const height = 460 - margin.top - margin.bottom;

    const svg = d3.select('#chart')
      .append('svg')
      .attr('width', width + margin.left + margin.right)
      .attr('height', height + margin.top + margin.bottom);

    const g = svg.append('g')
      .attr('transform', `translate(${margin.left},${margin.top})`);

    const parseDate = (d) => new Date(d + '-01T00:00:00');
    const dates = dataset.map((d) => parseDate(d[0]));

    const xScale = d3.scaleTime()
      .domain([d3.min(dates), d3.max(dates)])
      .range([0, width]);

    const yScale = d3.scaleLinear()
      .domain([0, d3.max(dataset, (d) => d[1])])
      .range([height, 0]);

    const tooltip = d3.select('#tooltip');

    g.selectAll('.bar')
      .data(dataset)
      .enter()
      .append('rect')
      .attr('class', 'bar')
      .attr('x', (d) => xScale(parseDate(d[0])))
      .attr('y', (d) => yScale(d[1]))
      .attr('width', width / dataset.length)
      .attr('height', (d) => height - yScale(d[1]))
      .attr('data-date', (d) => d[0])
      .attr('data-gdp', (d) => d[1])
      .on('mouseover', function (event, d) {
        const [year, month] = d[0].split('-');
        const quarter = ['Q1', 'Q2', 'Q3', 'Q4'][Math.floor((Number(month) - 1) / 3)];
        tooltip
          .attr('data-date', d[0])
          .style('opacity', 1)
          .html(`<strong>${year} ${quarter}</strong><br>$${d[1].toFixed(1)} Billion`);
        const rect = this.getBoundingClientRect();
        tooltip
          .style('left', `${rect.left + window.scrollX + margin.left}px`)
          .style('top', `${rect.top + window.scrollY - 10}px`);
      })
      .on('mouseout', () => tooltip.style('opacity', 0));

    const xAxis = d3.axisBottom(xScale).ticks(10).tickFormat(d3.timeFormat('%Y'));
    g.append('g')
      .attr('id', 'x-axis')
      .attr('class', 'axis')
      .attr('transform', `translate(0,${height})`)
      .call(xAxis);

    const yAxis = d3.axisLeft(yScale);
    g.append('g')
      .attr('id', 'y-axis')
      .attr('class', 'axis')
      .call(yAxis);

    g.append('text')
      .attr('class', 'axis-label')
      .attr('x', width / 2)
      .attr('y', height + 50)
      .attr('text-anchor', 'middle')
      .text('Year');

    g.append('text')
      .attr('class', 'axis-label')
      .attr('transform', 'rotate(-90)')
      .attr('x', -height / 2)
      .attr('y', -60)
      .attr('text-anchor', 'middle')
      .text('GDP (Billions USD)');
  }
</script>
</body>
</html>
